name: geofence_alarm
description: A location-based alarm application that triggers when user enters a geofence area.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geofence_service: ^5.0.0
  flutter_local_notifications: ^16.1.0
  audioplayers: ^5.2.1
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.1
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
